name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild from the selected main commit (for example, v1.6.0)
        required: true
        type: string

concurrency:
  group: release
  queue: max

permissions: {}

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.manual-release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.manual-release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha || steps.manual-release.outputs.sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout selected release commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Run Release Please
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Create recovery draft release
        id: manual-release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Recovery releases must be dispatched from main"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Input must be a semantic version tag (for example, v1.6.0)"
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          gradle_version="$(awk '/^version = / { print $3; exit }' gradle.properties)"
          manifest_version="$(jq -er '."."' .release-please-manifest.json)"
          if [[ "$version" != "$gradle_version" || "$version" != "$manifest_version" ]]; then
            echo "::error::Tag version must match gradle.properties and .release-please-manifest.json"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # Release Please creates the release as a draft, because published releases are immutable and
  # could no longer receive assets. The draft is published only after the assets are attached.
  build-assets:
    name: Build and sign release assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    cache-mode: write
    environment: release
    permissions:
      contents: read
    outputs:
      zip: ${{ steps.assets.outputs.zip }}
      sbom: ${{ steps.assets.outputs.sbom }}
      grype_report: ${{ steps.grype-report-upload.outputs.artifact-id }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.jetbrains.ai:443
            artifacts-caching-proxy.aws.intellij.net:443
            cache-redirector.jetbrains.com:443
            corretto.aws:443
            corretto.github.io:443
            d2cico3c979uwg.cloudfront.net:443
            d2s4y8xcwt8bet.cloudfront.net:443
            data.services.jetbrains.com:443
            download-cdn.jetbrains.com:443
            download.jetbrains.com:443
            downloads.gradle.org:443
            downloads.marketplace.jetbrains.com:443
            github.com:443
            grype.anchore.io:443
            jb.gg:443
            plugins-artifacts.gradle.org:443
            plugins.gradle.org:443
            plugins.jetbrains.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            services.gradle.org:443
            www.jetbrains.com:443

      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and verify plugin and SBOM
        run: ./gradlew buildPlugin cyclonedxBom check verifyPlugin --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Locate generated SBOM
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(build/distributions/*.cdx.json)
          if [[ ${#sboms[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one CycloneDX SBOM, found ${#sboms[@]}"
            exit 1
          fi
          echo "path=${sboms[0]}" >> "$GITHUB_OUTPUT"

      - name: Scan generated SBOM with Grype
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ steps.sbom.outputs.path }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: ${{ runner.temp }}/grype-results.sarif

      - name: Upload Grype scan report
        id: grype-report-upload
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-sbom-scan
          path: ${{ runner.temp }}/grype-results.sarif
          retention-days: 1
          if-no-files-found: warn

      - name: Sign plugin and export public certificate
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTIFICATE_CHAIN:?Signing certificate is required}"
          : "${PRIVATE_KEY:?Signing key is required}"
          ./gradlew signPlugin verifyPluginSignature --no-daemon

          # Publish the public CERTIFICATE_CHAIN as chain.crt for later signature verification.
          mkdir release-assets
          if [[ "$CERTIFICATE_CHAIN" == *"-----BEGIN CERTIFICATE-----"* ]]; then
            printf '%s\n' "$CERTIFICATE_CHAIN" > release-assets/chain.crt
          else
            printf '%s' "$CERTIFICATE_CHAIN" | base64 --decode > release-assets/chain.crt
          fi
          if grep -q 'PRIVATE KEY' release-assets/chain.crt; then
            echo "::error::Certificate chain must not contain a private key"
            exit 1
          fi
          openssl x509 -in release-assets/chain.crt -noout

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(build/distributions/*-signed.zip)
          sboms=(build/distributions/*.cdx.json)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one signed plugin archive, found ${#zips[@]}"
            exit 1
          fi
          if [[ ${#sboms[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one CycloneDX SBOM, found ${#sboms[@]}"
            exit 1
          fi

          cp "${zips[0]}" "${sboms[0]}" release-assets/
          zip_name="$(basename "${zips[0]}")"
          sbom_name="$(basename "${sboms[0]}")"
          (cd release-assets && sha256sum "$zip_name" "$sbom_name" chain.crt > SHA256SUMS)

          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom_name" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  upload-grype-sarif:
    name: Upload Grype SARIF
    needs: [ release-please, build-assets ]
    if: ${{ !cancelled() && needs.build-assets.outputs.grype_report != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Download Grype SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grype-sbom-scan
          path: ${{ runner.temp }}/grype-sarif

      - name: Upload Grype SARIF to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/grype-sarif/grype-results.sarif
          checkout_path: ${{ github.workspace }}
          category: grype-sbom
          ref: refs/heads/main
          sha: ${{ needs.release-please.outputs.sha }}

  publish-release:
    name: Attest assets and publish release
    needs: [ release-please, build-assets ]
    runs-on: ubuntu-latest
    permissions:
      # Attaches the assets to the draft release and publishes it.
      contents: write
      # Needed to sign and store the attestations.
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            uploads.github.com:443

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # Marketplace can modify the ZIP container; attest the exact JAR bytes inside it too.
      - name: Extract plugin JARs for attestation
        shell: bash
        env:
          PLUGIN_ZIP: ${{ needs.build-assets.outputs.zip }}
        run: |
          set -euo pipefail
          unzip -q "release-assets/$PLUGIN_ZIP" '*.jar' -d attestation-jars

      # Attest release assets and all packaged JARs, including bundled dependencies.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*
            attestation-jars/**/*.jar

      # Binds the CycloneDX SBOM to the plugin zip it describes.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/${{ needs.build-assets.outputs.zip }}
          sbom-path: release-assets/${{ needs.build-assets.outputs.sbom }}

      - name: Upload assets to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  scorecard:
    name: Refresh Scorecard after release
    needs: publish-release
    permissions:
      contents: read
      security-events: write
      id-token: write
    uses: $/.github/workflows/scorecard.yaml
