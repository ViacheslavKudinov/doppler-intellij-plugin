name: Warm Gradle cache

on:
  push:
    branches: [ main ]

permissions:
  contents: read

cache-mode: write

jobs:
  warm:
    name: Warm Gradle cache
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: 21
          cache-jdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Populate Gradle cache
        run: bash .github/scripts/gradle-with-retry.sh testClasses ktlintCheck --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g
