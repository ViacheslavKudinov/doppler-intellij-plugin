name: Compile agentic workflows

on:
  workflow_run:
    workflows: ["Validate agentic workflow sources"]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  compile:
    name: Compile PR sources without write credentials
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.stage.outputs.has_changes }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Agentic Workflows compiler
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          compiler_dir="$RUNNER_TEMP/gh-aw-cli"
          mkdir -p "$compiler_dir"
          gh release download v1.2.2 --repo github/gh-aw \
            --pattern linux-amd64 --dir "$compiler_dir"
          printf '%s  %s\n' \
            'c2378d85466d29cdbdfebd0e513557b5cbec18d34f44e7cc00c2fa323687a153' \
            "$compiler_dir/linux-amd64" | sha256sum --check --status
          chmod +x "$compiler_dir/linux-amd64"

      - name: Compile Markdown workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gh-aw-cli/linux-amd64" compile --strict

      - name: Stage changed compiled workflows
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/compiled-agentic-workflows"
          mkdir -p "$staging/.github/workflows"
          git ls-files --modified --others --exclude-standard -z \
            -- '.github/workflows/*.lock.yml' |
            while IFS= read -r -d '' path; do
              if [[ ! "$path" =~ ^\.github/workflows/[a-zA-Z0-9._-]+\.lock\.yml$ ]]; then
                echo "::error::Unexpected compiled workflow path"
                exit 1
              fi
              if [[ -L "$path" || ! -f "$path" ]]; then
                echo "::error::Compiled workflows must be regular files"
                exit 1
              fi
              mkdir -p "$staging/$(dirname "$path")"
              cp -- "$path" "$staging/$path"
            done

          find "$staging/.github/workflows" -type f -print0 |
            LC_ALL=C sort -z |
            while IFS= read -r -d '' path; do
              relative="${path#"$staging"/}"
              printf '%s\n' "$relative"
            done > "$staging/manifest.txt"

          if [[ ! -s "$staging/manifest.txt" ]]; then
            echo "No compiled workflow changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Upload compiled workflows
        if: steps.stage.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-agentic-workflows
          path: ${{ runner.temp }}/compiled-agentic-workflows
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit validated compiler output
    needs: compile
    if: needs.compile.result == 'success' && needs.compile.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download compiled workflows as data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-agentic-workflows
          path: ${{ runner.temp }}/compiled-agentic-workflows

      - name: Validate compiled workflow artifact
        env:
          COMPILED_ARTIFACT_DIR: ${{ runner.temp }}/compiled-agentic-workflows
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.COMPILED_ARTIFACT_DIR;
          const manifest = path.join(root, 'manifest.txt');
          if (!fs.lstatSync(manifest).isFile()) {
            throw new Error('Compiled workflow manifest is not a regular file.');
          }
          const entries = fs.readFileSync(manifest, 'utf8').split('\n').filter(Boolean);
          if (entries.length > 50 || new Set(entries).size !== entries.length) {
            throw new Error('Compiled workflow manifest has invalid entries.');
          }
          for (const entry of entries) {
            if (!/^\.github\/workflows\/[a-zA-Z0-9._-]+\.lock\.yml$/.test(entry)) {
              throw new Error('Unexpected compiled workflow path.');
            }
            const file = path.join(root, entry);
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.size > 2 * 1024 * 1024) {
              throw new Error('Compiled workflow artifact must be a regular file under 2 MiB.');
            }
          }
          NODE

      - name: Create branch-update token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.GH_AW_APP_ID }}
          private-key: ${{ secrets.GH_AW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write

      - name: Commit compiled workflows to the exact PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMPILED_ARTIFACT_DIR: ${{ runner.temp }}/compiled-agentic-workflows
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const artifactDir = process.env.COMPILED_ARTIFACT_DIR;
            const manifestPath = path.join(artifactDir, 'manifest.txt');
            if (!fs.lstatSync(manifestPath).isFile()) {
              throw new Error('Compiled workflow manifest is not a regular file.');
            }
            const entries = fs.readFileSync(manifestPath, 'utf8')
              .split('\n').filter(Boolean);
            if (entries.length > 50 || new Set(entries).size !== entries.length) {
              throw new Error('Compiled workflow manifest has invalid entries.');
            }
            const additions = entries.map(filePath => {
              if (!/^\.github\/workflows\/[a-zA-Z0-9._-]+\.lock\.yml$/.test(filePath)) {
                throw new Error('Unexpected compiled workflow path.');
              }
              const fullPath = path.join(artifactDir, filePath);
              const stat = fs.lstatSync(fullPath);
              if (!stat.isFile() || stat.size > 2 * 1024 * 1024) {
                throw new Error('Compiled workflow artifact must be a regular file under 2 MiB.');
              }
              return { path: filePath, contents: fs.readFileSync(fullPath).toString('base64') };
            });
            if (additions.length === 0) {
              core.info('Compiled workflows are already up to date; no commit needed.');
              return;
            }
            const pullRequest = context.payload.workflow_run.pull_requests[0];
            if (
              !pullRequest ||
              pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              pullRequest.base.ref !== context.payload.repository.default_branch
            ) {
              throw new Error('Workflow run is not associated with an eligible same-repository pull request.');
            }
            await github.graphql(`
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid }
                }
              }
            `, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName: pullRequest.head.ref,
                },
                expectedHeadOid: context.payload.workflow_run.head_sha,
                message: {
                  headline: 'ci: regenerate compiled agentic workflows',
                  body: 'Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>',
                },
                fileChanges: { additions },
              },
            });
            core.info(`Committed ${additions.length} compiled workflow file(s).`);
