name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (e.g., v1.0.0)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Publish release artifact to JetBrains Marketplace
    runs-on: ubuntu-latest
    cache-mode: none
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Check out the current repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag }}
          fetch-tags: true

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Download and verify signed release artifact
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$RELEASE_TAG" --pattern '*.zip' --dir release-artifacts
          archives=(release-artifacts/*.zip)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo "Expected exactly one release plugin archive" >&2
            exit 1
          fi
          archive="${archives[0]}"
          gh attestation verify "$archive" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release-please.yaml"
          echo "path=$archive" >> "$GITHUB_OUTPUT"

      # Publish plugin to JetBrains Marketplace
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PLUGIN_ARCHIVE: ${{ steps.artifact.outputs.path }}
        run: ./gradlew publishPlugin "-PprebuiltPluginArchive=$PLUGIN_ARCHIVE" --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g
