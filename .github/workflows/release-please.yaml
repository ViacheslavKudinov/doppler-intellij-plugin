name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild from the selected main commit (for example, v1.6.0)
        required: true
        type: string

concurrency:
  group: release
  queue: max

permissions: {}

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.manual-release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.manual-release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha || steps.manual-release.outputs.sha }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout selected release commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Run Release Please
        id: release
        if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Create recovery draft release
        id: manual-release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Recovery releases must be dispatched from main"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Input must be a semantic version tag (for example, v1.6.0)"
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          gradle_version="$(awk '/^version = / { print $3; exit }' gradle.properties)"
          manifest_version="$(jq -er '."."' .release-please-manifest.json)"
          if [[ "$version" != "$gradle_version" || "$version" != "$manifest_version" ]]; then
            echo "::error::Tag version must match gradle.properties and .release-please-manifest.json"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --generate-notes \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  # Release Please creates the release as a draft, because published releases are immutable and
  # could no longer receive assets. The draft is published only after the assets are attached.
  build-assets:
    name: Build and sign release assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    cache-mode: write
    environment: release
    permissions:
      contents: read
    outputs:
      zip: ${{ steps.assets.outputs.zip }}
      sbom: ${{ steps.assets.outputs.sbom }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build and verify plugin and SBOM
        run: ./gradlew buildPlugin cyclonedxBom check verifyPlugin --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Sign plugin and export public certificate
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${CERTIFICATE_CHAIN:?Signing certificate is required}"
          : "${PRIVATE_KEY:?Signing key is required}"
          ./gradlew signPlugin verifyPluginSignature --no-daemon

          # Publish the public CERTIFICATE_CHAIN as chain.crt for later signature verification.
          mkdir release-assets
          if [[ "$CERTIFICATE_CHAIN" == *"-----BEGIN CERTIFICATE-----"* ]]; then
            printf '%s\n' "$CERTIFICATE_CHAIN" > release-assets/chain.crt
          else
            printf '%s' "$CERTIFICATE_CHAIN" | base64 --decode > release-assets/chain.crt
          fi
          if grep -q 'PRIVATE KEY' release-assets/chain.crt; then
            echo "::error::Certificate chain must not contain a private key"
            exit 1
          fi
          openssl x509 -in release-assets/chain.crt -noout

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(build/distributions/*-signed.zip)
          sboms=(build/distributions/*.cdx.json)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one signed plugin archive, found ${#zips[@]}"
            exit 1
          fi
          if [[ ${#sboms[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one CycloneDX SBOM, found ${#sboms[@]}"
            exit 1
          fi

          cp "${zips[0]}" "${sboms[0]}" release-assets/
          zip_name="$(basename "${zips[0]}")"
          sbom_name="$(basename "${sboms[0]}")"
          (cd release-assets && sha256sum "$zip_name" "$sbom_name" chain.crt > SHA256SUMS)

          echo "zip=$zip_name" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom_name" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Attest assets and publish release
    needs: [ release-please, build-assets ]
    runs-on: ubuntu-latest
    permissions:
      # Attaches the assets to the draft release and publishes it.
      contents: write
      # Needed to sign and store the attestations.
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # Attest the signed plugin zip, SBOM, public certificate chain and checksums.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      # Binds the CycloneDX SBOM to the plugin zip it describes.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/${{ needs.build-assets.outputs.zip }}
          sbom-path: release-assets/${{ needs.build-assets.outputs.sbom }}

      - name: Upload assets to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
