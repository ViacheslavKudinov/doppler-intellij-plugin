version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps): '
    groups:
      minor-updates:
        applies-to: version-updates
        update-types:
          - minor
        patterns:
          - "*"
      patch-updates:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - "*"
      major-updates:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    groups:
      minor-updates:
        applies-to: version-updates
        update-types:
          - minor
        patterns:
          - "*"
      patch-updates:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - "*"
      major-updates:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps): '
