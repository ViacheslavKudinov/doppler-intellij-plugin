name: Release

on:
  push:
    branches: [ main ]

permissions: {}

jobs:
  build:
    name: Run CI checks
    uses: $/.github/workflows/build.yaml
  
  release-please:
    needs: build
    name: Create release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  release-artifacts:
    name: Sign, attest & publish GitHub release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build plugin and SBOM
        run: ./gradlew buildPlugin cyclonedxBom --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          archives=(build/distributions/*-signed.zip)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo "Expected exactly one signed plugin archive" >&2
            exit 1
          fi
          archive="${archives[0]}"
          plugin="${archive%-signed.zip}.zip"
          sbom="${archive%-signed.zip}.cdx.json"
          test -s "$sbom"
          mv "$archive" "$plugin"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      - name: Attest signed plugin provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.plugin }}

      - name: Attest plugin SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.plugin }}
          sbom-path: ${{ steps.artifacts.outputs.sbom }}

      - name: Attest SBOM provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.sbom }}

      - name: Attach artifacts and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          PLUGIN_FILE: ${{ steps.artifacts.outputs.plugin }}
          SBOM_FILE: ${{ steps.artifacts.outputs.sbom }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" "$PLUGIN_FILE" "$SBOM_FILE" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
