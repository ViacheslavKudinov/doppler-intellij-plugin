name: Build plugin
on:
  pull_request:
    paths:
      - src/**
      - gradle/**
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradlew
      - gradlew.bat
      - .editorconfig
      - .github/scripts/gradle-with-retry.sh
      - .github/workflows/build.yaml
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Token used by the Codecov upload step
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions: {}

cache-mode: read

jobs:
  # Prepare the environment and build the plugin
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      plugin_artifact_prefix: ${{ steps.plugin.outputs.artifact_prefix }}
      plugin-url: ${{ steps.upload-pr-plugin.outputs.artifact-url }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      
      # Check out the current repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Build plugin
      - name: Build plugin
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            args+=(-Psnapshot)
          fi
          bash .github/scripts/gradle-with-retry.sh buildPlugin "${args[@]}" --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Locate plugin archive
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(build/distributions/*.zip)
          if [[ ${#zips[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one plugin archive, found ${#zips[@]}"
            exit 1
          fi
          archive_name=$(basename "${zips[0]}")
          echo "name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=${archive_name%.zip}" >> "$GITHUB_OUTPUT"
          echo "path=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload PR plugin
        id: upload-pr-plugin
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plugin.outputs.name }}
          path: ${{ steps.plugin.outputs.path }}
          retention-days: 7
          if-no-files-found: error

  comment-pr-plugin:
    name: Comment PR plugin
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Comment with PR plugin link
        uses: step-security/sticky-pull-request-comment@3f74a8f2b4dc745810ded9bbfd887679bccd13c2 # v3.0.5
        with:
          header: pr-plugin
          recreate: true
          message: |
            [Download the PR plugin](${{ needs.build.outputs.plugin-url }})

            The artifact expires after 7 days.

  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Check Kotlin formatting
        run: bash .github/scripts/gradle-with-retry.sh ktlintCheck --no-daemon --console=plain

  grype:
    name: Grype
    needs: [ build ]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Generate PR SBOM
        run: bash .github/scripts/gradle-with-retry.sh cyclonedxBom -Psnapshot --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Locate generated SBOM
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sboms=(build/distributions/*.cdx.json)
          if [[ ${#sboms[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one CycloneDX SBOM, found ${#sboms[@]}"
            exit 1
          fi
          echo "path=${sboms[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload PR SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.plugin_artifact_prefix }}-sbom
          path: ${{ steps.sbom.outputs.path }}
          retention-days: 7
          if-no-files-found: error

      - name: Scan PR SBOM with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ steps.sbom.outputs.path }}
          fail-build: true
          severity-cutoff: high
          output-format: table
          output-file: ${{ runner.temp }}/grype-pr-report.txt

      - name: Write Grype job summary
        if: ${{ always() }}
        shell: bash
        env:
          GRYPE_REPORT: ${{ runner.temp }}/grype-pr-report.txt
        run: |
          set -euo pipefail
          {
            printf '### Grype SBOM Scan\n\n'
            if [[ -s "$GRYPE_REPORT" ]]; then
              printf '<pre>\n'
              sed -e 's/\&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' "$GRYPE_REPORT"
              printf '\n</pre>\n'
            else
              printf 'No scan report was produced. Check the preceding steps for SBOM generation or scanner errors.\n'
              exit 1
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Run tests and upload test reports on failure
  test:
    name: Test
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # Check out the current repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Run tests
      - name: Run Tests
        run: bash .github/scripts/gradle-with-retry.sh check jacocoTestReport --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml

  # Run plugin structure verification along with IntelliJ Plugin Verifier
  verify:
    name: Verify plugin
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # Check out the current repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Run Verify Plugin task and IntelliJ Plugin Verifier tool
      - name: Run Plugin Verification tasks
        shell: bash
        run: |
          bash .github/scripts/gradle-with-retry.sh verifyPlugin --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Upload verification problems report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.build.outputs.plugin_artifact_prefix }}-plugin-verification-problems
          path: build/reports/problems/problems-report.html
          retention-days: 1
          if-no-files-found: warn
