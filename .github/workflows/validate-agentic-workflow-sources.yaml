name: Validate agentic workflow sources

on:
  pull_request:
    paths:
      - .github/workflows/**.md
      - .github/workflows/compile-agentic-workflows.yaml

permissions: {}

jobs:
  validate:
    name: Check workflow source changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
