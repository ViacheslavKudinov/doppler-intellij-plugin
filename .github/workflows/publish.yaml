name: Publish

on:
  release:
    types: [ released ]

permissions:
  contents: read

jobs:
  publish:
    name: Sign & Publish to JetBrains Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      # Check out the current repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: 21
          cache: gradle
          cache-jdk: true

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Build plugin
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      # Sign plugin
      - name: Sign plugin
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

      # Publish plugin to JetBrains Marketplace
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin --no-daemon -Pkotlin.daemon.jvmargs=-Xmx4g

    #   - name: Upload signed artifact
    #     uses: actions/upload-artifact@v7
    #     with:
    #       name: plugin-signed
    #       path: build/distributions/*-signed.zip
    #       retention-days: 30