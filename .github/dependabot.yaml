version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: 'chore(deps): '
    groups:
      minor-patch-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      major-updates:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    groups:
      minor-patch-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      major-updates:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    commit-message:
      prefix: 'chore(deps): '
